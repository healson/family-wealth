services:
  family-wealth:
    # 仅本地构建，不使用 image 字段（避免 Docker 误从 Docker Hub 拉取）
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-wealth
    restart: unless-stopped
    ports:
      - "8000:8000"          # 如需改端口，修改冒号左侧，如 "8080:8000"
    environment:
      - ADMIN_PASSWORD=admin123      # 初始登录密码（首次登录后请在「设置管理」中修改）
      - SEED_DEMO_DATA=true          # true=首次启动写入演示数据；false=空白开始
      - JWT_SECRET=please-change-me # 生产环境务必改为随机长字符串
      - JWT_EXPIRE_HOURS=168         # 登录有效期（小时），默认 7 天
      - TZ=Asia/Shanghai
      # ---- AI 助手配置（可选，不配置则 AI 对话提示未配置）----
      # 兼容 OpenAI / DeepSeek / 通义 / 本地 Ollama（OpenAI 格式接口）
      - AI_API_KEY=                  # 如 sk-xxx（本地 Ollama 可不填）
      - AI_BASE_URL=https://api.openai.com/v1   # DeepSeek: https://api.deepseek.com/v1；Ollama: http://127.0.0.1:11434/v1
      - AI_MODEL=gpt-4o-mini         # DeepSeek: deepseek-chat；Ollama: 如 qwen2.5
      # ---- MCP 鉴权令牌（可选，供外部 AI Agent 连接）----
      # - MCP_TOKEN=change-me        # 设置后，外部 Agent 需带此令牌访问 /mcp
      # - MCP_USERNAME=admin         # stdio 模式默认操作的账号
    volumes:
      - ./data:/data                 # SQLite 数据库持久化目录（重要！勿删）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default

# 为项目指定独立网段，避免占用 Docker 默认地址池
# （部分 NAS 因网络过多报 "all predefined address pools have been fully subnetted"）
# 若 10.89.0.0/24 与你内网冲突，可改为 10.88.0.0/24、172.31.0.0/24 等
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
