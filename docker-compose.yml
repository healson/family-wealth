# ==============================================================================
# family-wealth 部署配置 —— 从 GHCR 拉取预构建镜像
# ==============================================================================
# 【首次部署】镜像包默认是私有的，不登录直接 pull 会报 unauthorized（认证问题，不是网络问题）
#   1) 造令牌：GitHub → Settings → Developer settings → Personal access tokens
#              → Tokens (classic) → Generate new token (classic) → 只勾【read:packages】
#   2) 登录：  echo "ghp_你的PAT" | docker login ghcr.io -u healson --password-stdin
#      · 凭据记在「执行 docker 的那个用户」名下；以 root 跑 → /root/.docker/config.json，
#        换成别的用户跑 compose 会再次 401，需用该用户重登
#      · 用 --password-stdin，避免 PAT 进 shell history / ps
#   3) 启动：  docker compose pull && docker compose up -d
#   4) 自查：  curl http://127.0.0.1:8000/api/health      # 应回当前版本号
#              uname -m                                  # 需 x86_64；aarch64 会报 no matching manifest
#
#   ✱ 不想在机器上存 PAT：把包设为 public 即可免登录（镜像内容将对所有人可见）
#       https://github.com/users/healson/packages/container/family-wealth/settings
#       → Danger Zone → Change visibility → Public
#   ✱ 判定 unauthorized 是不是认证问题：私有包在 token 端点就 401 ——
#       curl -s "https://ghcr.io/token?scope=repository:healson/family-wealth:pull&service=ghcr.io"
#
# 【升级】（数据在 ./data 里，不会丢）
#   docker compose pull && docker compose up -d
#   ⚠️ up -d 不会自动拉新镜像（本地已有就不拉）→ 漏写 pull 会静默跑旧版本
# ==============================================================================

services:
  family-wealth:
    # 默认从 GitHub Container Registry 拉取预构建镜像
    # （push main 后 GitHub Actions 自动构建并推送，无需 node/docker build 环境）
    # 🔴 本机首次部署必须先登录，否则 pull 报 unauthorized：
    #     echo "<有 read:packages 权限的 PAT>" | docker login ghcr.io -u healson --password-stdin
    # 想固定版本改用 :1.7.9；想精确回溯用 @sha256:<digest>
    image: ghcr.io/healson/family-wealth:latest
    container_name: family-wealth
    restart: unless-stopped
    ports:
      - "8000:8000"          # 如需改端口，修改冒号左侧，如 "8080:8000"
    environment:
      - ADMIN_PASSWORD=admin123      # 初始登录密码（首次登录后请在「设置管理」中修改）
      - SEED_DEMO_DATA=true          # true=首次启动写入演示数据；false=空白开始
      - JWT_SECRET=please-change-me # 生产环境务必改为随机长字符串
      - JWT_EXPIRE_HOURS=168         # 登录有效期（小时），默认 7 天
      - TZ=Asia/Shanghai
      # ---- AI 助手配置（可选，不配置则 AI 对话提示未配置）----
      # 兼容 OpenAI / DeepSeek / 通义 / 本地 Ollama（OpenAI 格式接口）
      - AI_API_KEY=                  # 如 sk-xxx（本地 Ollama 可不填）
      - AI_BASE_URL=https://api.openai.com/v1   # DeepSeek: https://api.deepseek.com/v1；Ollama: http://127.0.0.1:11434/v1
      - AI_MODEL=gpt-4o-mini         # DeepSeek: deepseek-chat；Ollama: 如 qwen2.5
      # ---- MCP 鉴权令牌（可选，供外部 AI Agent 连接）----
      # - MCP_TOKEN=change-me        # 设置后，外部 Agent 需带此令牌访问 /mcp
      # - MCP_USERNAME=admin         # stdio 模式默认操作的账号
    volumes:
      - ./data:/data                 # SQLite 数据库持久化目录（重要！勿删）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default

# 为项目指定独立网段，避免占用 Docker 默认地址池
# （部分 NAS 因网络过多报 "all predefined address pools have been fully subnetted"）
# 若 10.89.0.0/24 与你内网冲突，可改为 10.88.0.0/24、172.31.0.0/24 等
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
