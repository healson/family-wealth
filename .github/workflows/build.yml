name: Build and Push to GHCR

# 每次 push 到 main（或打 v*.*.* 标签）自动在 GitHub 云端构建并推送 Docker 镜像到
# GitHub Container Registry (GHCR)，NAS 上直接 `docker compose pull` 即可，无需本地 build。
# 推送使用 GitHub 自带的 GITHUB_TOKEN，不需要任何手动配置的密钥/密码。

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest 只在「分支推送」时更新。
          # 为什么必须显式写：metadata-action 的 type=semver 在默认 flavor=latest=auto 下，
          # 遇到正式版 tag（如 1.7.9）会**自动追加 latest**——这与下面 raw/sha 两条上的
          # enable={{is_default_branch}} 无关（实测 tag 推送时那两条确实未生效，latest 却
          # 仍被写入了）。后果是：若将来给**旧提交**补打标签，latest 会被悄悄回退到旧版本，
          # NAS 下次 `docker compose pull` 就静默降级。这里显式按 ref 类型分流，让
          # 「:X.Y.Z 归标签、:latest 归 main」互不干扰。
          flavor: |
            latest=${{ github.ref_type == 'branch' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
