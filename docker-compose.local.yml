# 本地构建版（对应 tar.gz 部署流程）：在 NAS 上用 node + docker build 现场构建前端。
# 用法：docker compose -f docker-compose.local.yml up -d --build
# 默认 docker-compose.yml 已改为从 GHCR 直接拉取预构建镜像，无需本地构建。

services:
  family-wealth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-wealth
    restart: unless-stopped
    ports:
      - "8000:8000"          # 如需改端口，修改冒号左侧，如 "8080:8000"
    environment:
      - ADMIN_PASSWORD=admin123      # 初始登录密码（首次登录后请在「设置管理」中修改）
      - SEED_DEMO_DATA=true          # true=首次启动写入演示数据；false=空白开始
      - JWT_SECRET=please-change-me # 生产环境务必改为随机长字符串
      - JWT_EXPIRE_HOURS=168         # 登录有效期（小时），默认 7 天
      - TZ=Asia/Shanghai
      # ---- AI 助手配置（可选，不配置则 AI 对话提示未配置）----
      - AI_API_KEY=                  # 如 sk-xxx（本地 Ollama 可不填）
      - AI_BASE_URL=https://api.openai.com/v1
      - AI_MODEL=gpt-4o-mini
      # ---- 更新检查（可选，只为「设置管理 → 系统更新」的检查按钮服务）----
      # 不配置也能正常用，只是点「检查更新」会提示「未配置来源」。
      # 该功能**只读**：不拉镜像、不重启容器，升级始终手动执行。
      # 二选一即可，推荐第 ① 种（不用在容器里放令牌）：
      # ① 公开清单：放一个可公开访问的 JSON，内容形如 {"version":"1.9.0"}
      # - UPDATE_CHECK_MANIFEST_URL=https://example.com/family-wealth-version.json
      # ② GitHub 令牌：查 Releases（本仓库私有，匿名查不到）
      # - GITHUB_TOKEN=ghp_xxx
      # ---- 自动备份（默认开启，每日一份并轮转；只为「自用没有第二个人兜底」）----
      # ⚠️ 默认目录 ./data/backups 与数据库**同卷** —— 卷损坏时两者一起没。
      #    建议指到 NAS 上另一处目录，才算真正多一份保险（宿主目录记得挂进来）。
      # - BACKUP_DIR=/backups          # 需配合下面 volumes 里加一行挂载
      # - BACKUP_KEEP=14               # 保留最近多少份
      # - BACKUP_ENABLED=false         # 关闭自动备份（不推荐）
    volumes:
      - ./data:/data                 # SQLite 数据库持久化目录（重要！勿删）
      # - /vol1/1000/backups/family-wealth:/backups   # 配合 BACKUP_DIR 指到异卷（NAS 上另一处目录）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
